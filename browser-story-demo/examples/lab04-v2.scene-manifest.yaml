project: lab-04-recall-aware-product-master
entrypoint: ../demo-v2/index.html
output_dir: /private/tmp/lab04-v2-recordings
scene_query_param: scene
ready_selector: html[data-capture-ready="true"]

browser:
  viewport: 1512x982
  zoom: 100
  scale_factor: 2

capture:
  backend: avfoundation
  screen: 6
  display: built-in
  native_dimensions: 3024x1964
  crop: 3024x1700+0+0
  output_dimensions: 3024x1700
  pixel_format: yuv420p
  frame_rate: 30

